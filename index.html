<title>Little Knight Chess</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Little Knight">
<meta name="theme-color" content="#FFC83D">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Lilita+One&display=swap">
<style>
/* Toy-block playroom: one sunny room, thick outlines, buttons that press down like blocks. Single bright look by design. */
:root{
 --sun:#FFC83D;--sun-deep:#F2A900;--tomato:#EE4B2B;--leaf:#17A673;--cobalt:#2360E0;--ink:#1B2559;--paper:#FFFFFF;--mist:#FFF4CF;
 --sq-light:#FFF1BE;--sq-dark:#3DBFAE;
 --display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
 --body:"Andika","Trebuchet MS","Segoe UI",system-ui,sans-serif;
 --press:5px;color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--sun);color:var(--ink);font-family:var(--body);font-size:20px;line-height:1.35;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
[hidden]{display:none!important}
#app{height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.screen{height:100%;min-height:0}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.3px}
svg.pieces-defs{position:absolute;width:0;height:0}
.pc-svg{--s:#1B2559;display:block;width:100%;height:100%;overflow:visible}
.w{--f:#FFFFFF;--a:#FFC83D;--s:#1B2559}
.b{--f:#2B2F6E;--a:#FF7F5C;--s:#10143F}

.btn{font-family:var(--display);font-size:22px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:14px;min-height:60px;padding:8px 18px;box-shadow:0 var(--press) 0 var(--ink);cursor:pointer;transition:transform .06s,box-shadow .06s;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active:not(:disabled){transform:translateY(var(--press));box-shadow:0 0 0 var(--ink)}
.btn:disabled{opacity:.42;cursor:default}
.btn:focus-visible,.step:focus-visible,.tile:focus-visible,.side:focus-visible,.tier:focus-visible{outline:4px solid var(--cobalt);outline-offset:3px}
.btn.go{background:var(--leaf);color:#fff}
.btn.hot{background:var(--tomato);color:#fff}
.btn.sky{background:var(--cobalt);color:#fff}
.btn.small{font-size:18px;min-height:52px;padding:6px 14px}

/* HOME */
#home{display:flex;gap:40px;align-items:center;justify-content:center}
.home-board{flex:0 1 auto;height:min(82%,62vw);aspect-ratio:1;position:relative;min-width:0;display:flex;align-items:center;justify-content:center}
.home-menu{flex:0 1 430px;min-width:0;display:flex;flex-direction:column;gap:16px}
.logo{font-size:clamp(46px,7.4vw,76px);line-height:.95;color:var(--ink)}
.logo em{font-style:normal;color:var(--tomato)}
.home-sub{margin:0 0 4px;font-size:21px}
.mode{justify-content:flex-start;text-align:left;font-size:27px;min-height:84px;padding:8px 18px;gap:14px;width:100%}
.mode .ic{width:58px;height:58px;flex:none}
.mode small{display:block;font-family:var(--body);font-size:17px;font-weight:400;line-height:1.2}
.home-foot{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stars-total{font-family:var(--display);font-size:22px;margin-right:auto}
.star{color:var(--sun-deep)}

/* HEADERS */
.bar{display:flex;align-items:center;gap:12px;flex:none}
.bar h2{font-size:32px;min-width:0;flex:1}

/* SETUP */
#setup{display:flex;flex-direction:column;gap:14px;max-width:880px;margin:auto;overflow:auto}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:18px 22px;box-shadow:0 7px 0 var(--ink)}
.lv-name{font-family:var(--display);font-size:40px;text-align:center;line-height:1}
.lv-desc{text-align:center;margin:4px 0 12px;min-height:28px}
.stairs{display:flex;align-items:flex-end;gap:clamp(3px,1vw,10px);height:clamp(130px,25vh,210px)}
.step{flex:1 1 0;min-width:0;border:3px solid var(--ink);border-radius:10px 10px 4px 4px;background:var(--mist);font-family:var(--display);font-size:clamp(18px,3vw,28px);color:var(--ink);display:flex;align-items:flex-start;justify-content:center;padding:6px 0 0;cursor:pointer;touch-action:manipulation;position:relative}
.step.on{background:var(--sun)}
.step.sel{background:var(--tomato);color:#fff}
.step .beat{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-size:.8em;color:var(--sun-deep)}
.sides{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.side{flex:1 1 150px;display:flex;gap:8px;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;background:var(--paper);border:3px solid var(--ink);border-radius:14px;min-height:68px;color:var(--ink);cursor:pointer;touch-action:manipulation}
.side.sel{background:var(--sun)}
.side .ic{width:44px;height:44px}
.label{font-family:var(--display);font-size:20px;text-align:center;margin:0 0 8px}

/* BOARD */
.play{display:flex;gap:22px;height:100%;min-height:0}
.board-host{flex:1 1 0;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
.panel{flex:0 0 clamp(290px,34vw,400px);min-width:0;min-height:0;display:flex;flex-direction:column;gap:12px}
.board{position:relative;border-radius:6px;box-shadow:0 0 0 7px var(--ink),0 14px 0 7px rgba(27,37,89,.28);touch-action:none;flex:none}
.grid{position:absolute;inset:0;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border-radius:6px;overflow:hidden}
.sq{position:relative;background:var(--sq-light)}
.sq.d{background:var(--sq-dark)}
.sq.last{background:#FFD95E}
.sq.d.last{background:#E9C53C}
.sq.sel{background:#FFA62B!important}
.sq.check{background:radial-gradient(circle,#FF5A36 25%,#E23413 80%)!important}
.sq .co{position:absolute;font:700 clamp(9px,1.5vmin,14px) var(--body);color:var(--ink);opacity:.5;pointer-events:none}
.sq .co.f{right:3px;bottom:0}.sq .co.r{left:3px;top:0}
.sq.t::after{content:"";position:absolute;inset:33%;border-radius:50%;background:#fff;border:3px solid var(--ink);z-index:1}
.sq.t.danger::after{background:var(--tomato)}
.sq.t.cap::after{inset:4%;background:transparent;border:6px solid var(--ink);box-shadow:inset 0 0 0 3px #fff}
.sq.t.cap.danger::after{border-color:var(--tomato)}
.sq.mg::before,.sq.mr::before{content:"";position:absolute;inset:5%;border-radius:12%;border:5px solid var(--leaf);background:rgba(23,166,115,.2)}
.sq.mr::before{border-color:var(--tomato);background:rgba(238,75,43,.2)}
.sq .tag{position:absolute;right:4%;top:4%;width:44%;height:44%;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--display);font-size:clamp(14px,2.8vmin,28px);display:flex;align-items:center;justify-content:center;z-index:4}
.layer{position:absolute;inset:0;pointer-events:none}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;padding:3.5%/3.5%;transition:transform .24s cubic-bezier(.3,1.25,.5,1),opacity .2s;will-change:transform}
.pc svg{filter:drop-shadow(0 2px 0 rgba(16,20,63,.3))}
.pc.drag{transition:none;z-index:20}
.pc.drag svg{transform:scale(1.28)}
.pc.gone{opacity:0}
.pc.hop{animation:hop .5s ease}
@keyframes hop{40%{margin-top:-5%}}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:12}
.nope{animation:nope .35s}
@keyframes nope{20%,60%{translate:-7px 0}40%,80%{translate:7px 0}}

/* GAME PANEL */
.turn{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid var(--ink);border-radius:16px;padding:10px 14px;flex:none;min-height:82px}
.turn .ic{width:54px;height:54px;flex:none}
.turn b{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.05;display:block}
.turn span{font-size:17px;display:block}
.turn>div{min-width:0}
.tray{display:flex;flex-wrap:wrap;align-items:center;min-height:36px;flex:none;gap:0}
.tray .m{width:30px;height:30px;margin-right:-8px}
.tray .lead{margin-left:14px;font-family:var(--display);font-size:20px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:none}
.spacer{flex:1;min-height:0}
#game.ai #btnHelper{grid-column:1/-1}
#lExit{grid-column:1;grid-row:2}#lNext{grid-column:2;grid-row:2}
.legend{font-size:16px;margin:0;display:flex;gap:8px;align-items:center;flex:none}
.legend i{width:20px;height:20px;border-radius:50%;background:var(--tomato);border:3px solid var(--ink);flex:none}

/* OVERLAY */
.over{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(27,37,89,.62);z-index:40;padding:16px}
.over .card{text-align:center;max-width:460px;display:flex;flex-direction:column;gap:12px;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.over h2{font-size:clamp(34px,6vw,48px);line-height:1}
.over p{margin:0}
.over .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
@keyframes pop{from{transform:scale(.7)}}
.bigstars{font-size:56px;line-height:1;letter-spacing:6px}
.bigstars .off{color:#E5DFC8}
.promo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.promo button{background:var(--mist);border:3px solid var(--ink);border-radius:12px;padding:6px;width:clamp(70px,14vmin,104px);aspect-ratio:1;cursor:pointer}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}

/* LESSON MAP */
#learn{display:flex;flex-direction:column;gap:12px}
.tiers{display:flex;flex-wrap:wrap;gap:8px;flex:none}
.tier{flex:1 1 150px;font-family:var(--display);font-size:clamp(18px,2.8vw,24px);background:var(--mist);color:var(--ink);border:3px solid var(--ink);border-radius:14px;min-height:60px;cursor:pointer;touch-action:manipulation;padding:4px}
.tier.sel{background:var(--ink);color:#fff}
.tiles{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:14px;align-content:start;padding:4px 4px 16px}
.tile{display:flex;gap:12px;align-items:center;text-align:left;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;box-shadow:0 var(--press) 0 var(--ink);color:var(--ink);font-family:var(--body);font-size:17px;cursor:pointer;touch-action:manipulation;min-width:0;min-height:112px}
.tile:active{transform:translateY(var(--press));box-shadow:none}
.tile.next{background:var(--mist);border-color:var(--tomato);box-shadow:0 var(--press) 0 var(--tomato)}
.tile .ic{width:62px;height:62px;flex:none}
.tile h3{font-size:23px;line-height:1.05}
.tile>div{min-width:0}
.tile .st{font-size:22px;letter-spacing:2px;line-height:1.1}
.tile .st .off{color:#E5DFC8}
.badge{display:inline-block;font-family:var(--display);font-size:14px;background:var(--tomato);color:#fff;border-radius:8px;padding:1px 8px;margin-left:6px;vertical-align:2px}

/* LESSON PLAYER */
.dots{display:flex;gap:5px;flex:none}
.dots i{flex:1;height:12px;border-radius:6px;background:var(--paper);border:2px solid var(--ink)}
.dots i.done{background:var(--leaf)}
.dots i.now{background:var(--tomato)}
.coach{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px}
.coach-top{display:flex;align-items:center;gap:10px;flex:none}
.coach-face{width:64px;height:64px;flex:none}
.coach-face.talk{animation:talk .55s ease-in-out infinite}
@keyframes talk{50%{transform:translateY(-5px) rotate(-5deg)}}
.lesson-name{font-family:var(--display);font-size:22px;line-height:1.05;min-width:0;flex:1}
#lReset{flex:none;min-height:46px;font-size:17px;padding:4px 12px}
.trybadge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:30}
.trybadge span{font-family:var(--display);font-size:clamp(30px,6.5vmin,60px);color:#fff;background:var(--tomato);border:4px solid var(--ink);border-radius:22px;padding:6px 26px;box-shadow:0 7px 0 var(--ink);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
.empty{grid-column:1/-1;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:16px}
.bubble{flex:1 1 0;min-height:0;overflow-y:auto;background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:12px 16px;font-size:clamp(21px,2.6vw,26px);line-height:1.3}
.bubble .kind{display:block;font-family:var(--display);font-size:17px;color:var(--cobalt)}
.bubble.ok{background:#DDF7EA}.bubble.ok .kind{color:var(--leaf)}
.bubble.oops{background:#FFE7DF}.bubble.oops .kind{color:var(--tomato)}

/* DIALOG */
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px}
.voice-pick{display:flex;flex-direction:column;gap:6px}
.voice-row{display:flex;gap:10px;align-items:center}
#sPick{flex:1 1 0;min-width:0;min-height:52px;font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:4px 8px}

@media (orientation:portrait),(max-width:760px){
 #home{flex-direction:column;gap:18px}
 .home-board{flex:1 1 0;height:auto;min-height:0;width:100%;aspect-ratio:auto}
 .home-menu{flex:none;width:min(100%,560px)}
 .play{flex-direction:column;gap:14px}
 .board-host{flex:1 1 0}
 .panel{flex:0 0 clamp(250px,36%,360px);width:100%}
 .turn{min-height:64px;padding:6px 12px}.turn .ic{width:42px;height:42px}
 .bubble{font-size:21px}
 .coach-face{width:44px;height:44px}
 #game .panel{flex:0 0 auto}
 #game .spacer{display:none}
 #game .actions{grid-template-columns:repeat(3,1fr)}
 #game.ai #btnHelper{grid-column:auto}
 #game.ai #btnHome{grid-column:span 2}
}
@media (max-width:480px){
 .btn{font-size:19px;padding:6px 8px}
 .logo{font-size:44px}.home-sub{display:none}
 .mode{min-height:66px;font-size:22px}.mode .ic{width:44px;height:44px}.mode small{font-size:15px}
 .bar h2{font-size:25px}
 .board-host{flex:0 0 calc(100vw - 24px);max-height:62%}
 #lesson .panel{flex:1 1 0}
 #game .btn{font-size:17px;min-height:50px;padding:4px}
 #setup{gap:8px}.card{padding:10px 12px}.lv-name{font-size:27px}.stairs{height:110px}
 .side{min-height:52px;font-size:18px}.side .ic{display:none}.label{margin-bottom:4px}
 #startGame{min-height:60px!important;font-size:24px!important}
}
@media (max-height:620px) and (orientation:landscape){
 .home-sub{display:none}.logo{font-size:44px}.mode{min-height:62px;font-size:22px}.mode .ic{width:42px;height:42px}
 .home-menu{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<symbol id="R" viewBox="0 0 100 100"><g stroke="var(--s)" stroke-width="4.5" stroke-linejoin="round" fill="var(--f)"><path d="M35 75l3-33h24l3 33z"/><use href="#base"/><path d="M29 42V17h11v9h6v-9h8v9h6v-9h11v25z"/><rect x="31" y="38" width="38" height="9" rx="4" fill="var(--a)"/></g></symbol>
<symbol id="B" viewBox="0 0 100 100"><g stroke="var(--s)" stroke-width="4.5" stroke-linejoin="round" fill="var(--f)"><path d="M35 75c4-9 9-15 9-26h12c0 11 5 17 9 26z"/><use href="#base"/><path d="M50 14C36 24 31 35 38 46h24c7-11 2-22-12-32z"/><path d="M55 25l-9 13" fill="none" stroke="var(--a)" stroke-width="5.5" stroke-linecap="round"/><rect x="36" y="44" width="28" height="9" rx="4.5" fill="var(--a)"/><circle cx="50" cy="10" r="5.5" fill="var(--a)"/></g></symbol>
<symbol id="Q" viewBox="0 0 100 100"><g stroke="var(--s)" stroke-width="4.5" stroke-linejoin="round" fill="var(--f)"><path d="M34 75c4-10 8-16 8-27h16c0 11 4 17 8 27z"/><use href="#base"/><path d="M31 45L21 20l16 11 13-20 13 20 16-11-10 25z"/><rect x="32" y="42" width="36" height="9" rx="4.5" fill="var(--a)"/><g fill="var(--a)"><circle cx="20" cy="17" r="5.5"/><circle cx="50" cy="9" r="6"/><circle cx="80" cy="17" r="5.5"/></g></g></symbol>
<symbol id="K" viewBox="0 0 100 100"><g stroke="var(--s)" stroke-width="4.5" stroke-linejoin="round" fill="var(--f)"><path d="M34 75c4-10 8-16 8-27h16c0 11 4 17 8 27z"/><use href="#base"/><path d="M33 45C23 33 27 21 38 22c6 0 10 4 12 9 2-5 6-9 12-9 11-1 15 11 5 23z"/><rect x="32" y="42" width="36" height="9" rx="4.5" fill="var(--a)"/><path d="M45 4h10v7h7v9h-7v10H45V20h-7v-9h7z" fill="var(--a)"/></g></symbol>
<symbol id="N" viewBox="0 0 100 100"><g stroke="var(--s)" stroke-width="4.5" stroke-linejoin="round" fill="var(--f)"><path d="M31 75c1-14 8-23 19-31l-1-7c-5 5-11 9-18 11-5 1-10-1-11-7-1-4 1-7 4-10C33 24 37 18 41 13l1-9 9 8c20 2 33 20 33 42 0 8-1 15-3 21z"/><use href="#base"/><circle cx="44" cy="25" r="4.5" fill="var(--s)" stroke="none"/><path d="M60 16c9 7 15 18 16 31M53 21" fill="none" stroke="var(--a)" stroke-width="7" stroke-linecap="round"/><circle cx="27" cy="37" r="2" fill="var(--s)" stroke="none"/></g></symbol>
</defs></svg>

<div id="app">

<section id="home" class="screen">
 <div class="home-board" id="heroHost"></div>
 <div class="home-menu">
  <h1 class="logo">Little <em>Knight</em> Chess</h1>
  <p class="home-sub">Pick what to do today.</p>
  <button class="btn mode go" id="goLearn"><svg class="ic pc-svg w"><use href="#N"/></svg><span>Learn a Trick<small id="learnSub">Short lessons with practice</small></span></button>
  <button class="btn mode hot" id="goSetup"><svg class="ic pc-svg b"><use href="#Q"/></svg><span>Play the Computer<small>Pick a level from 1 to 10</small></span></button>
  <button class="btn mode sky" id="goTwo"><svg class="ic pc-svg w"><use href="#K"/></svg><span>Two Players<small>Take turns on this screen</small></span></button>
  <div class="home-foot">
   <span class="stars-total"><span class="star">★</span> <span id="totalStars">0</span> stars</span>
   <button class="btn small" id="resume" hidden>Keep playing</button>
   <button class="btn small" id="goGrown">Grown-ups</button>
  </div>
 </div>
</section>

<section id="setup" class="screen" hidden>
 <div class="bar"><button class="btn small" id="setupBack">Home</button><h2>Play the Computer</h2></div>
 <div class="card">
  <div class="lv-name" id="lvName"></div>
  <p class="lv-desc" id="lvDesc"></p>
  <div class="stairs" id="stairs" role="radiogroup" aria-label="Computer level from 1 to 10"></div>
 </div>
 <div class="card">
  <p class="label">Which side do you want?</p>
  <div class="sides" role="radiogroup" aria-label="Your side">
   <button class="side sel" data-side="w" id="sideW"><svg class="ic pc-svg w"><use href="#K"/></svg>White</button>
   <button class="side" data-side="b" id="sideB"><svg class="ic pc-svg b"><use href="#K"/></svg>Black</button>
   <button class="side" data-side="r" id="sideR">Surprise me</button>
  </div>
 </div>
 <button class="btn go" id="startGame" style="min-height:76px;font-size:32px;flex:none">Start the Game</button>

  const cap=!!p.b[to]||(m>>17&3)===1;let danger=false;if(showDanger){p.make(m);danger=p.attacked(to,p.side);p.undo();}out.push({sq:j,cap,danger});}
 return out;
}
function askPromotion(side){return new Promise(res=>{
 const o=$('overlay');o.innerHTML=`<div class="card"><h2>Pick a new piece!</h2><div class="promo">${['Q','R','B','N'].map(t=>`<button data-t="${t}" aria-label="${{Q:'Queen',R:'Rook',B:'Bishop',N:'Knight'}[t]}">${pieceSvg(side+t)}</button>`).join('')}</div></div>`;o.hidden=false;
 o.querySelectorAll('button').forEach(b=>b.onclick=()=>{o.hidden=true;o.innerHTML='';res(b.dataset.t.toLowerCase());});});}
async function resolveMove(p,fromI,toI){
 const base=nameOf(fromI)+nameOf(toI);if(p.find(base))return base;const col=p.side>0?'w':'b';const t=await askPromotion(col);return base+t;
}
function playedSound(p,capture){if(p.status()==='checkmate')return;if(p.inCheck())sfx.check();else if(capture)sfx.cap();else sfx.move();}
function isCapture(p,m){return !!p.b[m>>7&127]||(m>>17&3)===1;}

function trays(){
 const count=(c)=>{const n={P:0,N:0,B:0,R:0,Q:0};for(const x of G.pos.array())if(x&&x[0]===c&&n[x[1]]!=null)n[x[1]]++;return n;};const full={P:8,N:2,B:2,R:2,Q:1},val={P:1,N:3,B:3,R:5,Q:9};
 const w=count('w'),b=count('b');let wp=0,bp=0;for(const t in full){wp+=w[t]*val[t];bp+=b[t]*val[t];}
 const row=(c,cnt)=>{let h='';for(const t of ['Q','R','B','N','P'])for(let i=0;i<Math.max(0,full[t]-cnt[t]);i++)h+=pieceSvg(c+t,'m');return h;};
 const lead=wp-bp;const flipTop=gameBoard.flip;
 const topTakes=flipTop?'w':'b',bottomTakes=flipTop?'b':'w';
 const mk=(c)=>{const taken=row(c==='w'?'b':'w',c==='w'?b:w);const l=(c==='w'&&lead>0)?lead:(c==='b'&&lead<0)?-lead:0;return taken+(l?`<span class="lead">+${l}</span>`:'');};
 $('trayTop').innerHTML=mk(topTakes);$('trayBottom').innerHTML=mk(bottomTakes);
}
function renderGame(){
 const p=G.pos,last=G.moves.length?uciIdx(G.moves[G.moves.length-1]):null,chk=p.inCheck();
 gameBoard.handler=G.handler;gameBoard.sel=-1;gameBoard.targets=[];gameBoard.fx({last,check:chk?kingIdx(p):null});gameBoard.setArrows(G.hintArrow?[G.hintArrow]:[]);
 const col=p.side>0?'w':'b',name=p.side>0?'White':'Black';$('turnIcon').setAttribute('class','ic pc-svg '+col);
 let title,sub='';
 if(G.mode==='two'){title=name+"'s turn";sub=chk?'Check! Protect your king.':'Tap a piece to see its moves.';}
 else if(p.side===G.human){title='Your turn';sub=chk?'Check! Protect your king.':'Level '+G.level+': '+LEVELS[G.level-1][0];}
 else{title='Thinking...';sub=LEVELS[G.level-1][0]+' is choosing a move.';}
 if(G.over){title='Game over';sub='';}
 $('turnTitle').textContent=title;$('turnSub').textContent=sub;trays();
 const can=G.mode==='two'?G.moves.length>0:G.moves.length>=(G.human>0?2:3)||(G.moves.length>=1&&G.over);
 $('btnUndo').disabled=!can||G.busy;$('btnHint').disabled=G.busy||!!G.over;$('btnHelper').textContent='Dots: '+(settings.dots?'On':'Off');$('legend').style.visibility=settings.dots?'visible':'hidden';$('btnFlip').hidden=G.mode!=='two';
 $('game').classList.toggle('ai',G.mode==='ai');
}
G.handler={
 canPick(i){if(G.busy||G.over)return false;if(G.mode==='ai'&&G.pos.side!==G.human)return false;const a=G.pos.array()[i];return !!a&&(a[0]==='w')===(G.pos.side>0);},
 targets(i){return targetsFor(G.pos,i,settings.dots);},
 async move(f,t){const u=await resolveMove(G.pos,f,t);commitMove(u);},
};
function commitMove(u){const p=G.pos,m=p.find(u);if(!m)return;const cap=isCapture(p,m);p.make(m);G.moves.push(u);G.hintArrow=null;gameBoard.sync(p.array());playedSound(p,cap);
 if(checkEnd())return;saveGame();renderGame();if(G.mode==='ai'&&p.side!==G.human)aiTurn();}
async function aiTurn(){const tok=++G.tok;G.busy=true;renderGame();const q={fen:G.start,moves:G.moves.slice(),level:G.level};const[r]=await Promise.all([AI.ask(q),wait(650)]);if(tok!==G.tok)return;G.busy=false;if(r)commitMove(r);else renderGame();}
function checkEnd(){
 const p=G.pos,s=p.status();if(!s)return false;G.over=s;store.del('game');renderGame();
 let head,body;const row=[];
 if(s==='checkmate'){const winner=-p.side;
  if(G.mode==='ai'){if(winner===G.human){head='You won!';body='Checkmate! Great game.';const b=store.get('beaten',{});b[G.level]=1;store.set('beaten',b);if(G.level<10)row.push(['Try Level '+(G.level+1),'go',()=>{chosen=G.level+1;store.set('level',chosen);startGame({mode:'ai',level:chosen,human:G.human});}]);sfx.win();confetti();say('You won! Checkmate!');}
   else{head='Good try!';body='The computer got checkmate. Want to try again?';sfx.bad();say('Good try! Want to play again?');}}
  else{head=(winner>0?'White':'Black')+' wins!';body='Checkmate!';sfx.win();confetti();say(head);}
 }else{head="It's a tie!";body={stalemate:'Stalemate. The player to move had no safe moves.',insufficient:'There are not enough pieces left to checkmate.',fifty:'Fifty moves went by with no captures or pawn moves.',repetition:'The same position came up three times.'}[s];sfx.good();say("It's a tie!");}
 row.push(['Play Again',row.length?'':'go',()=>startGame({mode:G.mode,level:G.level,human:G.human})]);row.push(['Home','',()=>show('home')]);
 setTimeout(()=>showOverlay(head,body,row),s==='checkmate'?650:200);return true;
}
function showOverlay(head,body,btns,extra){const o=$('overlay');o.innerHTML=`<div class="card"><h2>${head}</h2>${extra||''}<p>${body}</p><div class="row"></div></div>`;const r=o.querySelector('.row');for(const[t,c,f]of btns){const b=document.createElement('button');b.className='btn '+c;b.textContent=t;b.onclick=()=>{o.hidden=true;o.innerHTML='';f();};r.appendChild(b);}o.hidden=false;}
function gameUndo(){if(G.busy)return;G.tok++;const wasOver=!!G.over;G.over=null;let n=G.mode==='two'?1:(G.pos.side===G.human?2:1);if(wasOver&&G.mode==='ai'&&G.pos.side===G.human)n=2;
 for(let i=0;i<n&&G.moves.length;i++){G.moves.pop();G.pos.undo();}G.hintArrow=null;gameBoard.sync(G.pos.array());saveGame();renderGame();if(G.mode==='ai'&&G.pos.side!==G.human)aiTurn();}

const LH={
 canPick(i){if(L.done||L.busy||L.pos.side!==L.human)return false;const a=L.pos.array()[i];return !!a&&(a[0]==='w')===(L.pos.side>0);},

};
function matDiff(p){const V={P:1,N:3,B:3,R:5,Q:9,K:0};let d=0;for(const x of p.array())if(x)d+=(x[0]==='w'?1:-1)*V[x[1]];return d;}
function goodList(p,s){const key=p.fen();if(L.goodKey!==key){const d=s.goal.depth||2,out=[];for(const m of p.legal()){p.make(m);const v=-E._score(p,d);p.undo();out.push([p.uci(m),v]);}out.sort((a,b)=>b[1]-a[1]);L.goodKey=key;L.goodList=out;}return L.goodList;}
function tryBadge(){const h=$('lessonHost');const old=h.querySelector('.trybadge');if(old)old.remove();const d=document.createElement('div');d.className='trybadge';d.innerHTML='<span>Try again!</span>';h.appendChild(d);setTimeout(()=>d.remove(),1600);}
function solAlts(s,ply){return s.sol[ply].split('|');}
function isRight(s,u){const p=L.pos;
 if(s.goal==='any')return true;
 if(s.goal&&s.goal.good){const l=goodList(p,s),x=l.find(y=>y[0]===u);return !!x&&x[1]>=l[0][1]-s.goal.good;}
 const m=p.find(u);
 if(s.goal==='safe'){p.make(m);const bad=!!E.mateMove(p,1);p.undo();return !bad;}
 if(s.goal&&s.goal.mate){p.make(m);const ok=E.forced(p,s.goal.mate-L.ply/2);p.undo();return ok;}
 return solAlts(s,L.ply).includes(u);}
function answerMove(s){const p=L.pos;
 if(s.goal&&s.goal.good){const l=goodList(p,s);return l.length?l[0][0]:null;}
 if(s.goal&&s.goal.mate){const m=E.mateMove(p,s.goal.mate-L.ply/2);return m?p.uci(m):null;}
 if(s.goal==='safe'){for(const m of p.legal()){p.make(m);const bad=!!E.mateMove(p,1);p.undo();if(!bad)return p.uci(m);}return null;}
 if(s.sol)return solAlts(s,L.ply)[0];const l=p.legal();return l.length?p.uci(l[0]):null;}
async function tryMove(u){
 const s=L.step,p=L.pos,tok=L.tok;const m=p.find(u);if(!m)return;const right=isRight(s,u);lessonBoard.setArrows([]);
 const cap=isCapture(p,m);p.make(m);lessonSync(p,true,{last:uciIdx(u)});playedSound(p,cap);
 if(!right){L.busy=true;L.wrong++;L.mistakes++;sfx.bad();const st=p.status();tryBadge();await wait(1150);if(tok!==L.tok)return;L.pos=new E.Pos(L.startFen);L.ply=0;lessonSync(L.pos,true);L.busy=false;lessonBoard.handler=LH;
  const lead=st==='stalemate'?'That is stalemate, a tie!':'Not that one.';
  if(L.wrong===1){const t=`${lead} ${s.hint}`;setBubble('Try again',t,'oops');say(t);}else{showAnswerArrow(s);const t=`${lead} Follow the arrow.`;setBubble('Try again',t,'oops');say(t);}
  return;}
 L.ply++;
 const finishedMate=s.goal&&s.goal.mate&&p.status()==='checkmate';
 const more=s.sol&&L.ply<s.sol.length;const moreMate=s.goal&&s.goal.mate&&!finishedMate;
 if(more||moreMate){L.busy=true;await wait(800);if(tok!==L.tok)return;
  let r;if(more){r=s.sol[L.ply];}else{const lst=p.legal();r=null;for(const x of lst){p.make(x);const quick=(s.goal.mate-(L.ply+1)/2)>1&&E.mateMove(p,1);p.undo();if(!quick){r=p.uci(x);break;}}if(!r)r=p.uci(lst[0]);}
  const rm=p.find(r),rc=isCapture(p,rm);p.make(rm);lessonSync(p,true,{last:uciIdx(r)});playedSound(p,rc);L.ply++;L.busy=false;L.wrong=0;
  const t='Good! Now finish it.';setBubble('Keep going',t,'ok');say(t);return;}
 L.done=true;sfx.good();const t=s.good||PRAISE[Math.floor(Math.random()*PRAISE.length)];setBubble('You did it!',t,'ok');say(t);setButtons({next:true,alt:null,nextText:L.i===L.lesson.steps.length-1?'Finish':'Next'});
}
function showAnswerArrow(s){const u=answerMove(s);if(u)lessonBoard.setArrows([[u.slice(0,2),u.slice(2,4),'#17A673']]);}
function gameGoal(p,mv){const g=L.step.goal,me=L.human,st=p.status(),pr=mv>>14&7;
 if(g==='mate'){if(st==='checkmate')return p.side===me?'lose':'win';return st?'lose':null;}
 if(g==='promote'){if(pr)return p.side===-me?'win':'lose';return st?'lose':null;}
 if(g==='castle'){if(p.side===-me&&(mv>>17&3)===2)return 'win';if(st==='checkmate')return p.side===me?'lose':'win';if(p.side===-me&&(matDiff(p)-L.matStart)*me<=-3)return 'lose';return st?'lose':null;}
 if(g==='hunt'){if(p.count(1,-me)===0)return 'win';if(pr)return 'lose';return st?'lose':null;}
 return null;}
function applyGame(u){const p=L.pos,m=p.find(u),cap=isCapture(p,m);p.make(m);L.moves.push(u);lessonBoard.setArrows([]);lessonSync(p,true,{last:uciIdx(u)});playedSound(p,cap);return gameGoal(p,m);}
function gameResult(r){const s=L.step;L.done=true;lessonBoard.handler=null;
 if(r==='win'){const w=(s.goal!=='mate'&&L.pos.status()==='checkmate')?'Checkmate! You won the whole game!':s.win;sfx.win();confetti();setBubble('You did it!',w,'ok');say(w);setButtons({next:true,alt:null,nextText:L.i===L.lesson.steps.length-1?'Finish':'Next'});}
 else{sfx.bad();L.mistakes++;setBubble('So close',s.lose,'oops');say(s.lose);setButtons({next:true,nextText:'Skip',alt:'Try Again'});}}
async function gameStepMove(u){const r=applyGame(u);if(r){gameResult(r);return;}L.busy=true;const tok=L.tok;const[a]=await Promise.all([AI.ask({fen:L.startFen,moves:L.moves.slice(),level:L.step.level}),wait(550)]);if(tok!==L.tok)return;L.busy=false;if(!a)return;const r2=applyGame(a);if(r2){gameResult(r2);return;}}
async function lessonHint(){const s=L.step;
 if(s.t==='show'){L.tok++;const tok=L.tok;runShow(s);return tok;}
 if(s.t==='game'){if(L.done){L.pos=new E.Pos(L.startFen);L.moves=[];L.done=false;lessonSync(L.pos,false);setBubble('Mini game',s.say);say(s.say);setButtons({next:false,alt:'Hint'});lessonBoard.handler=LH;return;}
  if(L.busy)return;L.busy=true;const tok=L.tok;setBubble('Hint',s.hint);say(s.hint);const cm=s.goal==='castle'?L.pos.legal().find(m=>(m>>17&3)===2):0;const r=cm?L.pos.uci(cm):await AI.ask({fen:L.startFen,moves:L.moves.slice(),hint:true,ms:700,depth:12});if(tok!==L.tok)return;L.busy=false;if(r)lessonBoard.setArrows([[r.slice(0,2),r.slice(2,4),'#17A673']]);return;}
 if(L.done)return;L.hints++;if(L.hints===1&&L.wrong===0){setBubble('Hint',s.hint);say(s.hint);}else{showAnswerArrow(s);const t='Follow the arrow.';setBubble('Hint',t);say(t);}
}
function lessonNext(){if(L.i<L.lesson.steps.length-1){enterStep(L.i+1);return;}finishLesson();}
function finishLesson(){hush();const l=L.lesson,stars=L.mistakes<=1?3:L.mistakes<=4?2:1,all=lessonStars(),prev=all[l.id]||0;all[l.id]=Math.max(prev,stars);store.set('stars',all);sfx.win();confetti(2400);
 const idx=LESSONS.indexOf(l),nx=LESSONS[idx+1];const btns=[];if(nx)btns.push(['Next Lesson','go',()=>{curTier=nx.tier;store.set('tier',curTier);openLesson(nx);}]);btns.push(['Do It Again','',()=>openLesson(l)]);btns.push(['All Lessons','',()=>show('learn')]);
 const big=`<div class="bigstars">${[1,2,3].map(i=>`<span class="${i<=stars?'star':'off'}">★</span>`).join('')}</div>`;
 const line='You earned '+stars+(stars===1?' star!':' stars!');say('Lesson done! '+line);showOverlay('Lesson done!',line,btns,big);}

/* ---------- Grown-ups ---------- */
function grownups(){const o=$('overlay');let armed=false;
 o.innerHTML=`<div class="card" style="text-align:left"><h2 style="font-size:34px">Grown-ups</h2>
 <div class="setting"><span>Read lessons aloud</span><button class="btn small" id="sVoice"></button></div>
 <div class="setting"><span>Coach voice</span><div class="voice-row"><button class="btn small" id="sRec"></button><button class="btn small" id="sTest">Hear It</button></div></div>
 <div class="voice-pick" id="sPickWrap"><label for="sPick">Device voice</label><select id="sPick"></select></div>
 <div class="setting"><span>Sound effects</span><button class="btn small" id="sSound"></button></div>
 <div class="setting"><span>Erase stars and saved game</span><button class="btn small" id="sReset">Erase</button></div>
 <p style="font-size:17px">Progress is saved on this device and browser.</p>
 <p style="font-size:15px;margin:0;opacity:.75">Lessons version ${LKC.version||"?"}: ${LESSONS.length} lessons, ${Object.keys(VOICE).length} recorded lines.</p>
 <div class="row"><button class="btn go" id="sDone">Done</button></div></div>`;o.hidden=false;
 const COACH='Hi! I am your chess coach. Are you ready to play?';
 const draw=()=>{$('sVoice').textContent=settings.voice?'On':'Off';$('sRec').textContent=settings.recorded?'Recorded':'Device';$('sSound').textContent=settings.sound?'On':'Off';$('sPickWrap').hidden=settings.recorded||!voiceList.length;};
 pickVoice();const pick=$('sPick');if(voiceList.length){pick.innerHTML=voiceList.slice(0,14).map(v=>`<option value="${v.voiceURI.replace(/"/g,'&quot;')}">${v.name.replace(/</g,'&lt;')}</option>`).join('');if(voice)pick.value=voice.voiceURI;pick.onchange=()=>{store.set('voiceId',pick.value);pickVoice();say(COACH,true);};}
 draw();$('sTest').onclick=()=>say(COACH,true);
 $('sRec').onclick=()=>{settings.recorded=!settings.recorded;store.set('recorded',settings.recorded);draw();say(COACH,true);};
 $('sVoice').onclick=()=>{settings.voice=!settings.voice;store.set('voice',settings.voice);draw();if(settings.voice)say('I will read to you.');else hush();};
 $('sSound').onclick=()=>{settings.sound=!settings.sound;store.set('sound',settings.sound);draw();sfx.move();};
 $('sReset').onclick=()=>{if(!armed){armed=true;$('sReset').textContent='Tap again to erase';return;}store.del('stars');store.del('beaten');store.del('game');$('sReset').textContent='Erased';$('sReset').disabled=true;refreshHome();};
 $('sDone').onclick=()=>{o.hidden=true;o.innerHTML='';refreshHome();};
}

/* ---------- Wiring ---------- */
$('goLearn').onclick=()=>{const nx=nextLesson();if(nx){curTier=nx.tier;}show('learn');};
$('goSetup').onclick=()=>{renderStairs();show('setup');};
$('goTwo').onclick=()=>startGame({mode:'two'});
$('resume').onclick=resumeGame;$('goGrown').onclick=grownups;
$('setupBack').onclick=()=>show('home');$('learnBack').onclick=()=>show('home');
$('startGame').onclick=()=>{let h=sideChoice==='w'?1:sideChoice==='b'?-1:(Math.random()<.5?1:-1);startGame({mode:'ai',level:chosen,human:h});};
$('btnUndo').onclick=gameUndo;$('btnHint').onclick=gameHint;
$('btnHelper').onclick=()=>{settings.dots=!settings.dots;store.set('dots',settings.dots);gameBoard.clearSel();renderGame();};
$('btnFlip').onclick=()=>{gameBoard.setFlip(!gameBoard.flip);renderGame();};
$('btnNew').onclick=()=>{if(G.mode==='two')startGame({mode:'two'});else{G.tok++;renderStairs();show('setup');}};
$('btnHome').onclick=()=>{G.tok++;show('home');};
$('lHear').onclick=()=>{const b=$('bubble').cloneNode(true);const k=b.querySelector('.kind');if(k)k.remove();say(b.textContent);};
$('lAlt').onclick=lessonHint;$('lNext').onclick=lessonNext;
$('lExit').onclick=()=>{L.tok++;show('learn');};
$('lReset').onclick=()=>{if(!L.lesson)return;hush();lessonBoard.setArrows([]);enterStep(L.i);};
window.__chess={E,G,L,LESSONS,AI,show,openLesson,enterStep,clipPlan,clipAudio};
show('home');
})();
</script>
